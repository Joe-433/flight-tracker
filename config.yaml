# ---------------------------------------------------------------------------
# Flight tracker config. Everything tunable lives here; no code changes needed.
# ---------------------------------------------------------------------------

route:
  # Google "MID" knowledge-graph ids. A city MID covers the whole metro area,
  # which is how we collapse 3 NY airports x 5 LA airports into one query.
  # VERIFY THESE ONCE: `python -m flight_tracker verify --config config.yaml`
  origin: "/m/02_286"
  destination: "/m/030qb3t"
  origin_label: "NY metro"
  destination_label: "LA metro"

search:
  # Departures from 1 week out to 3 months out. `window_days` is the span of
  # DEPARTURE dates; the return leg may land past the end of it.
  min_days_ahead: 7
  window_days: 83
  trip_nights: [3, 4, 5, 6, 7]
  max_stops: 0           # 0 = nonstop only
  carry_on_bags: 1
  checked_bags: 0
  currency: "USD"
  adults: 1
  seat: "economy"
  exclude_basic_economy: false

source:
  # pairs = one request per date pair, rotating slice per run (works with
  #         fast-flights 3.1.0 as published).
  # grid  = one request for the whole calendar matrix (needs a fork that
  #         actually implements get_calendar_grid; see README).
  # mock  = deterministic fake data, for testing the pipeline offline.
  backend: "pairs"
  pairs_per_run: 20      # per run; see README "Request budget" for the math
  jitter_seconds: [2, 5] # random pause between requests
  retries: 2
  # How the per-run budget is split across the horizon. Near-term fares move
  # fast and are the time-sensitive ones; fares 3 months out barely move, so
  # they get revisited less often. Each band rotates on its own cursor.
  bands:
    - {within_days: 30, share: 0.55}   # 1 week - 1 month out
    - {within_days: 60, share: 0.25}   # 1 - 2 months out
    - {within_days: 90, share: 0.20}   # 2 - 3 months out

alerts:
  threshold_usd: 250     # hard "tell me now" price
  cooldown_hours: 12     # don't re-alert the same date pair inside this window
  rebeat_drop_usd: 15    # ...unless it dropped at least this much more
  max_per_run: 3         # spam guard

history:
  days: 30
  max_points_per_pair: 40  # state.json is committed every run; keep it small
  resample_hours: 12       # log an unchanged price at most this often
  min_change_usd: 5        # ignore noise smaller than this

deals:
  min_observations: 6    # per date pair, before its baseline is trusted
  pct_below_baseline: 0.15   # 15% under its own median = notable
  cheap_percentile: 0.20     # bottom 20% of recent route-wide fares

deadman:
  fail_runs: 2           # consecutive empty/failed sweeps before alarming
  stale_hours: 6         # or: no usable price for this long
  renotify_hours: 24     # while still down, nag at most this often
