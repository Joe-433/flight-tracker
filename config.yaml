# ---------------------------------------------------------------------------
# Flight tracker config. Everything tunable lives here; no code changes needed.
# ---------------------------------------------------------------------------

route:
  # Full searches use Google's city MID for the origin: one request covers
  # JFK, LGA and EWR, and unwanted airports are filtered out of the results.
  origin: "/m/02_286"
  origin_airports: ["JFK", "LGA", "EWR"]
  exclude_origins: ["EWR"]

  # Destinations are named one by one. The LA city MID returns LAX and nothing
  # else (verified 49/49 on a raw payload), so the basin has to be spelled out.
  # Worth it: after a week of data, ONT, BUR and SNA all undercut LAX.
  destinations: ["LAX", "BUR", "SNA", "ONT", "LGB"]

  origin_label: "NY metro"
  destination_label: "LA metro"

search:
  # Departures 14 to 105 days out. `window_days` is the span of DEPARTURE
  # dates; the return leg may land past the end of it. The far end stops at
  # 105 because the flat "nothing ever moves" wall starts around 115.
  #
  # Measured 2026-09-13 on 385 real fares, cheapest nonstop per date pair:
  #     7-14 days   median $625      <- last-minute premium
  #    14-21 days   median $498
  #    21-30 days   median $507
  #    30-45 days   median $409
  #    45-60 days   median $391      <- floor
  #    60-75 days   median $419
  #    75-95 days   median $391
  #   115-150 days  $409 flat, every single sample, one airline
  #
  # The far end isn't a gradient, it's a wall: past ~105 days Google returns
  # base-fare inventory that doesn't move, so sweeping it buys nothing.
  min_days_ahead: 14
  window_days: 91
  trip_nights: [5, 6, 7]
  max_stops: 1           # allow one layover -- but see the lower threshold
  carry_on_bags: 1
  checked_bags: 0
  currency: "USD"
  adults: 1
  seat: "economy"
  exclude_basic_economy: false

source:
  backend: "pairs"        # pairs | mock
  # Full searches per run, split across shards. Each shard is a separate
  # GitHub runner -- a separate machine and usually a separate IP.
  drills_per_run: 60
  shards: 4
  jitter_seconds: [1, 3]  # random pause between requests on one runner
  retries: 2

grid:
  # Calendar scans (sources/grid.py): one request prices every departure date
  # in a 61-day window. 5 destinations x 3 trip lengths x 2 stop classes x 2
  # windows = 60 requests to price all 1,380 date pairs, against 1,380 for full
  # searches. The grid decides where full searches go; it never alerts alone.
  enabled: true
  refresh_minutes: 25
  jitter_seconds: [1, 2]
  notify_after_failures: 3

schedule:
  # How often a date pair earns a full search (planner.py). A pair is due when
  # the time since its last search exceeds its interval; the most overdue go
  # first, so nothing starves -- it just waits longer if it's unremarkable.
  base_hours: 24          # unremarkable fares
  cheap_hours: 3          # bottom 20% of their stop class
  cheapest_hours: 1       # bottom 5%, or the calendar says the price moved
  urgent_hours: 0.25      # under an alert threshold, or a new low
  moved_usd: 10           # calendar this far below the last full search

alerts:
  threshold_usd: 250              # nonstop: tell me now
  threshold_usd_with_stops: 200   # a layover has to be worth $50+ to hear about
  cooldown_hours: 12     # don't re-alert the same date pair inside this window
  # Record lows: tell me when a fare beats the cheapest ever seen, whatever the
  # number. Self-limiting -- every alert raises its own bar -- so it can't spam
  # even while the thresholds above stay silent for months.
  record_low: true
  record_min_drop_usd: 5
  rebeat_drop_usd: 15    # ...unless it dropped at least this much more
  max_per_run: 3         # spam guard

history:
  days: 30
  max_points_per_pair: 40  # state.json is committed every run; keep it small
  resample_hours: 12       # log an unchanged price at most this often
  min_change_usd: 5        # ignore noise smaller than this
  # Drop a fare from the reports if it hasn't been re-checked this recently.
  # A full cycle takes ~3 hours, so anything older than this is a fare we
  # stopped tracking -- it must not sit at the top of the report forever
  # quoting a price that may no longer exist.
  stale_hours: 36

deals:
  min_observations: 6    # per date pair, before its baseline is trusted
  pct_below_baseline: 0.15   # 15% under its own median = notable
  cheap_percentile: 0.05     # bottom 5% of recent route-wide fares

deadman:
  fail_runs: 2           # consecutive empty/failed sweeps before alarming
  stale_hours: 6         # or: no usable price for this long
  renotify_hours: 24     # while still down, nag at most this often
