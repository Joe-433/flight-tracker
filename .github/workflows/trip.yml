name: trip fares

# Trip mode (src/flight_tracker/trip.py), called by `watch fares` while
# config.yaml's `trip.until` is in the future. It rides on the same external
# 30-minute trigger; the plan stage decides whether a scan is actually due
# (every 6h, and before the daily report), so most calls end after one short
# job.
#
#   plan    scan due? split the one-way searches into shards
#   drill   one shard per runner, one IP each
#   apply   merge, roundtrip checks, AirHint, rank, Discord report, commit

on:
  workflow_call:
    inputs:
      notify:
        type: boolean
        default: true
      force:
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the triggering commit: a run that queued
          # behind another must see the trip.json that run just pushed.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: plan
        run: python -m flight_tracker trip-plan --out trip-plan.json --github-output "$GITHUB_OUTPUT" ${{ inputs.force && '--force' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: trip-plan
          path: trip-plan.json
          retention-days: 3

  drill:
    needs: plan
    if: needs.plan.outputs.shards != '' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the triggering commit: a run that queued
          # behind another must see the trip.json that run just pushed.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: trip-plan
      - name: One-way searches, shard ${{ matrix.shard }}
        run: >-
          python -m flight_tracker trip-sweep --plan trip-plan.json
          --shard ${{ matrix.shard }} --out trip-result-${{ matrix.shard }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-result-${{ matrix.shard }}
          path: trip-result-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 3

  apply:
    needs: [plan, drill]
    # Runs even if some shards failed, but only when a scan was planned.
    if: always() && needs.plan.outputs.shards != '' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the triggering commit: a run that queued
          # behind another must see the trip.json that run just pushed.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trip-plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: trip-result-*
          path: trip-results
          merge-multiple: true
      - name: Rank, roundtrip checks, daily report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          shopt -s nullglob
          python -m flight_tracker trip-apply --plan trip-plan.json \
            ${{ inputs.notify == false && '--no-notify' || '' }} ${{ inputs.force && '--send' || '' }} trip-results/*.json

      - name: Commit trip prices
        run: |
          git config user.name "flight-tracker"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/trip.json && [ -z "$(git ls-files --others -- data/trip.json)" ]; then
            echo "no changes"
            exit 0
          fi
          # Only this job writes data/trip.json, and watch runs never
          # overlap (concurrency group), so ours always wins: reset to the
          # remote and lay our file on top.
          cp data/trip.json /tmp/trip.json
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            cp /tmp/trip.json data/trip.json
            git add data/trip.json
            git diff --cached --quiet && { echo "remote already has this"; exit 0; }
            git commit --quiet -m "chore: trip prices $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not push trip prices" >&2
          exit 1
