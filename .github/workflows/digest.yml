name: daily digest

# A once-a-day summary of the cheapest days in the window. Also doubles as a
# heartbeat: if this stops arriving, the tracker itself has stopped running,
# which the in-process dead man's switch cannot tell you.

on:
  schedule:
    - cron: "0 13 * * *" # 09:00 ET / 06:00 PT
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m flight_tracker days --send --limit 10
