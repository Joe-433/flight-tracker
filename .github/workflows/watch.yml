name: watch fares

on:
  schedule:
    # Every 10 minutes. The repo is public, so Actions minutes are free and
    # unlimited -- the only real ceiling is how hard we're willing to hit
    # Google (~3,500 requests/day here). See README "Request budget" before
    # turning this up further; GitHub's own minimum interval is 5 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Override alert threshold (USD) for this run"
        required: false
      backend:
        description: "pairs | grid | mock"
        required: false
        default: "pairs"
      pairs:
        description: "Date pairs to sweep this run (default 20; try 80 for a deep manual scan)"
        required: false

permissions:
  contents: write

concurrency:
  # Never let two sweeps race on data/state.json.
  group: watch-fares
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep
        env:
          PYTHONPATH: src
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FT_THRESHOLD_USD: ${{ github.event.inputs.threshold }}
          FT_BACKEND: ${{ github.event.inputs.backend }}
          FT_PAIRS_PER_RUN: ${{ github.event.inputs.pairs }}
        run: python -m flight_tracker run --console

      - name: Commit price history
        env:
          PYTHONPATH: src
        run: |
          git config user.name "flight-tracker"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- data/state.json; then
            echo "no price changes"
            exit 0
          fi

          # state.json is a generated document: `git pull --rebase` can only
          # ever conflict on it, and a failed rebase leaves a detached HEAD
          # that cannot be pushed. So rebase nothing -- take whatever is on the
          # remote, merge it into ours semantically, and push that.
          for attempt in 1 2 3 4 5; do
            cp data/state.json /tmp/ours.json
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            git show origin/main:data/state.json > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            cp /tmp/ours.json data/state.json
            python -m flight_tracker merge /tmp/theirs.json

            if git diff --quiet -- data/state.json; then
              echo "remote already has this data"
              exit 0
            fi
            git add data/state.json
            git commit --quiet -m "chore: price history $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push --quiet; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push raced with another run; retrying"
            sleep $((attempt * 5))
          done
          echo "could not push price history after 5 attempts" >&2
          exit 1
