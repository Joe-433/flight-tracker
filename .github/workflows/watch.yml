name: watch fares

on:
  schedule:
    # Every 15 minutes. The repo is public, so Actions minutes are free and
    # unlimited -- the only real ceiling is how hard we're willing to hit
    # Google. See README "Request budget" before turning this up further;
    # GitHub's own minimum interval is 5 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Override alert threshold (USD) for this run"
        required: false
      backend:
        description: "pairs | grid | mock"
        required: false
        default: "pairs"
      pairs:
        description: "Date pairs to sweep this run (default 20; try 80 for a deep manual scan)"
        required: false

permissions:
  contents: write

concurrency:
  # Never let two sweeps race on data/state.json.
  group: watch-fares
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep
        env:
          PYTHONPATH: src
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FT_THRESHOLD_USD: ${{ github.event.inputs.threshold }}
          FT_BACKEND: ${{ github.event.inputs.backend }}
          FT_PAIRS_PER_RUN: ${{ github.event.inputs.pairs }}
        run: python -m flight_tracker run --console

      - name: Commit price history
        run: |
          git config user.name "flight-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          if git diff --staged --quiet; then
            echo "no price changes"
          else
            git commit -m "chore: price history $(date -u +%Y-%m-%dT%H:%MZ)"
            # A concurrent push is unlikely (see `concurrency` above) but cheap
            # to survive.
            git pull --rebase --autostash || true
            git push
          fi
