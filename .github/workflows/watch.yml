name: watch fares

# One run, three stages (see src/flight_tracker/pipeline.py):
#
#   plan    calendar scans, then choose which date pairs get a full search
#   drill   full searches, fanned out across runners -- one IP each
#   apply   fold the results into state, alert, commit
#
# The primary trigger is EXTERNAL: a free cron service calling this workflow's
# workflow_dispatch endpoint every 30 minutes (README, "External trigger").
# GitHub throttles its own schedules hard -- a */10 cron here delivered 41,
# then 12, then 6 runs a day -- but dispatch events run when they're sent.
# The schedule below is only a backstop in case the external trigger dies.

on:
  workflow_dispatch:
    inputs:
      drills:
        description: "Full searches this run (blank = config, 60)"
        required: false
      notify:
        description: "Send alerts"
        type: boolean
        default: true
      grid:
        description: "Run calendar scans"
        type: boolean
        default: true
      threshold:
        description: "Override the nonstop alert threshold (USD) for this run"
        required: false
      backend:
        description: "pairs | mock"
        required: false
        default: "pairs"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  # One run at a time: state has a single writer per run. A trigger that
  # arrives mid-run waits; a third replaces the waiting one.
  group: watch-fares
  cancel-in-progress: false

env:
  PYTHONPATH: src
  FT_DRILLS_PER_RUN: ${{ inputs.drills }}
  FT_THRESHOLD_USD: ${{ inputs.threshold }}
  FT_BACKEND: ${{ inputs.backend }}
  FT_GRID: ${{ inputs.grid == false && '0' || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: plan
        name: Calendar scans and drill plan
        run: python -m flight_tracker plan --out plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 3

  drill:
    needs: plan
    if: needs.plan.outputs.shards != '' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One shard failing must not cancel the others; apply uses what arrives.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Full searches, shard ${{ matrix.shard }}
        run: >-
          python -m flight_tracker sweep --plan plan.json
          --shard ${{ matrix.shard }} --out result-${{ matrix.shard }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.shard }}
          path: result-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 3

  apply:
    needs: [plan, drill]
    # Always: a run whose plan or drills crashed must still reach the dead
    # man's switch, or a total outage would be silent.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Apply results and alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NOTIFY: ${{ inputs.notify == false && '--no-notify' || '' }}
        run: |
          shopt -s nullglob
          python -m flight_tracker apply --plan plan.json --console $NOTIFY results/*.json

      - name: Commit price history
        run: |
          git config user.name "flight-tracker"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- data/state.json; then
            echo "no price changes"
            exit 0
          fi

          # state.json is a generated document: `git pull --rebase` can only
          # ever conflict on it, and a failed rebase leaves a detached HEAD
          # that cannot be pushed. So rebase nothing -- take whatever is on the
          # remote, merge it into ours semantically, and push that.
          for attempt in 1 2 3 4 5; do
            cp data/state.json /tmp/ours.json
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            git show "origin/$GITHUB_REF_NAME:data/state.json" > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            cp /tmp/ours.json data/state.json
            python -m flight_tracker merge /tmp/theirs.json

            if git diff --quiet -- data/state.json; then
              echo "remote already has this data"
              exit 0
            fi
            git add data/state.json
            git commit --quiet -m "chore: price history $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push raced with another run; retrying"
            sleep $((attempt * 5))
          done
          echo "could not push price history after 5 attempts" >&2
          exit 1
