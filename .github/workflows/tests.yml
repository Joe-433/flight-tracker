name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the full pipeline (no network)
        env:
          PYTHONPATH: src
        run: python -m flight_tracker --state /tmp/smoke.json run --backend mock --console --no-notify
