name: weekly report

# Top 10 cheapest fares, every Monday at 6:00am Pacific.
#
# GitHub cron is UTC only and has no idea about daylight saving, so 6am
# Pacific is 13:00 UTC for half the year and 14:00 UTC for the other half.
# We fire at both and let the job decide which one is really 6am local --
# otherwise the report drifts by an hour twice a year.

on:
  schedule:
    - cron: "0 13 * * 1"   # 6am PDT (Mar-Nov)
    - cron: "0 14 * * 1"   # 6am PST (Nov-Mar)
  workflow_dispatch:       # manual runs always send

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Is it actually 6am in Los Angeles?
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          hour = dt.datetime.now(ZoneInfo("America/Los_Angeles")).hour
          manual = os.environ["EVENT"] == "workflow_dispatch"
          print("send=%s" % ("true" if manual or hour == 6 else "false"))
          print("hour=%d" % hour)
          PY
        env:
          EVENT: ${{ github.event_name }}

      - name: Send report
        if: steps.gate.outputs.send == 'true'
        env:
          PYTHONPATH: src
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m flight_tracker report --send --limit 10

      - name: Skipped
        if: steps.gate.outputs.send != 'true'
        run: echo "Local hour is ${{ steps.gate.outputs.hour }}, not 6 -- this is the other DST cron."
